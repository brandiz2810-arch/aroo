<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARO OS - AI Second Brain</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent-color: #3b82f6;
            --text-color: #f8fafc;
            --text-dim: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            padding: 1rem;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Navigation Tabs */
        nav {
            display: flex;
            justify-content: space-around;
            background: var(--card-bg);
            padding: 0.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .nav-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-btn.active {
            color: var(--text-color);
            background: var(--accent-color);
        }

        /* Container */
        main {
            flex: 1;
            padding: 1rem;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .tab-content {
            display: none;
            height: 100%;
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* Card Styles */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem;
            backdrop-filter: blur(10px);
        }

        /* Chat / Assistant Tab */
        .chat-box {
            height: 50vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            padding: 0.5rem;
        }

        .message {
            max-width: 80%;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .message.user {
            align-self: flex-end;
            background: var(--accent-color);
            color: #fff;
        }

        .message.bot {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
        }

        .input-group {
            display: flex;
            gap: 8px;
        }

        input[type="text"], textarea {
            flex: 1;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            padding: 0.75rem;
            border-radius: 8px;
            color: var(--text-color);
            outline: none;
        }

        button.action-btn {
            background: var(--accent-color);
            border: none;
            color: white;
            padding: 0.75rem 1.25rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        /* Task Manager Tab */
        .task-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.03);
            padding: 0.75rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        /* Code Generator Tab */
        pre {
            background: #000;
            padding: 1rem;
            border-radius: 8px;
            overflow-x: auto;
            font-family: monospace;
            border: 1px solid var(--border-color);
            color: #10b981;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <i class="fa-solid fa-brain"></i> ARO OS
        </div>
        <span style="font-size: 0.8rem; color: var(--text-dim);">Live Second Brain</span>
    </header>

    <nav>
        <button class="nav-btn active" onclick="switchTab('assistant', event)"><i class="fa-solid fa-robot"></i> Assistant</button>
        <button class="nav-btn" onclick="switchTab('tasks', event)"><i class="fa-solid fa-check-double"></i> Tasks</button>
        <button class="nav-btn" onclick="switchTab('code', event)"><i class="fa-solid fa-code"></i> Code Gen</button>
    </nav>

    <main>
        <!-- Assistant Tab -->
        <div id="assistant" class="tab-content active">
            <div class="card chat-box" id="chatBox">
                <div class="message bot">
                    👋 Namaste! Main ARO OS Assistant hoon. Task manager, code generation ya personal assistance—bataiye kya karna hai?
                </div>
            </div>
            <div class="input-group">
                <input type="text" id="userInput" placeholder="Ask anything or give a command...">
                <button class="action-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>

        <!-- Task Manager Tab -->
        <div id="tasks" class="tab-content">
            <div class="card">
                <h3>Task Manager</h3>
                <br>
                <div class="input-group">
                    <input type="text" id="taskInput" placeholder="Add a new task...">
                    <button class="action-btn" onclick="addTask()">Add Task</button>
                </div>
            </div>
            <div class="card">
                <ul class="task-list" id="taskList">
                    <!-- Tasks will appear here -->
                </ul>
            </div>
        </div>

        <!-- Code Generator Tab -->
        <div id="code" class="tab-content">
            <div class="card">
                <h3>AI Code Generator</h3>
                <br>
                <textarea id="codePrompt" rows="3" placeholder="Describe the code you need..."></textarea>
                <br><br>
                <button class="action-btn" style="width: 100%;" onclick="generateCode()">Generate Code</button>
            </div>
            <div class="card">
                <h4>Generated Output:</h4>
                <br>
                <pre><code id="codeOutput">// Your generated code will appear here...</code></pre>
            </div>
        </div>
    </main>

    <script>
        function switchTab(tabId, event) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            if (!input.value.trim()) return;

            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.innerText = input.value;
            chatBox.appendChild(userMsg);

            const botMsg = document.createElement('div');
            botMsg.className = 'message bot';
            botMsg.innerText = "Processing request: " + input.value;
            
            setTimeout(() => {
                chatBox.appendChild(botMsg);
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 500);

            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function addTask() {
            const taskInput = document.getElementById('taskInput');
            const taskList = document.getElementById('taskList');
            if (!taskInput.value.trim()) return;

            const li = document.createElement('li');
            li.className = 'task-item';
            li.innerHTML = `
                <span>${taskInput.value}</span>
                <button onclick="this.parentElement.remove()" style="background:none; border:none; color:#ef4444; cursor:pointer;"><i class="fa-solid fa-trash"></i></button>
            `;
            taskList.appendChild(li);
            taskInput.value = '';
        }

        function generateCode() {
            const prompt = document.getElementById('codePrompt').value;
            const output = document.getElementById('codeOutput');
            if (!prompt.trim()) return;

            output.innerText = `// Generating code for: ${prompt}\n\nfunction example() {\n  console.log("Success!");\n}`;
        }
    </script>
</body>
</html>
